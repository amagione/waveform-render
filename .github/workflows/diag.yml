name: diag

on:
  workflow_dispatch:
    inputs:
      vid:
        description: 'media id'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: probe
        env:
          PUB_ID: ${{ secrets.PUB_ID }}
          PUB_SECRET: ${{ secrets.PUB_SECRET }}
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
          VID: ${{ github.event.inputs.vid }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          cid, cs, rt = os.environ['PUB_ID'], os.environ['PUB_SECRET'], os.environ['PUB_TOKEN']
          vid = (os.environ.get('VID') or '').strip()
          data = urllib.parse.urlencode({'client_id': cid, 'client_secret': cs,
                                         'refresh_token': rt,
                                         'grant_type': 'refresh_token'}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(
                      'https://oauth2.googleapis.com/token', data=data), timeout=30) as r:
                  tok = json.load(r)
              print('refresh: OK')
              print('granted_scope:', tok.get('scope', '?'))
              at = tok['access_token']
          except urllib.error.HTTPError as e:
              print('refresh: FAIL', e.code, e.read().decode()[:300])
              raise SystemExit(0)
          def probe(name, url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + at})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      j = json.load(r)
                  print(f'{name}: OK items={len(j.get("items", []))}')
              except urllib.error.HTTPError as e:
                  print(f'{name}: HTTP {e.code}', e.read().decode()[:220].replace(chr(10), ' '))
              except Exception as e:
                  print(f'{name}: ERR', repr(e)[:200])
          if vid:
              probe('captions.list', f'https://www.googleapis.com/youtube/v3/captions?part=snippet&videoId={vid}')
          probe('playlists.list', 'https://www.googleapis.com/youtube/v3/playlists?part=snippet&mine=true&maxResults=1')
          if vid:
              probe('commentThreads.list', f'https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId={vid}&maxResults=1')
          PY
