name: "Diag: NIM models probe [A397-16] r2"
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: NIM live test round 2 (no key output)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          key = (os.environ.get('NVIDIA_API_KEY') or '').strip()
          if not key:
              print('NO_KEY'); raise SystemExit(0)
          base = 'https://integrate.api.nvidia.com/v1'
          cands = ["nvidia/nemotron-3.5-lightning-30b-a3b", "minimaxai/minimax-m3.1-flash", "stepfun-ai/step-5-preview", "google/gemma-4-31b-it", "google/gemma-3-12b-it", "nvidia/nemotron-3.5-bolt-e4b"]
          for m in cands:
              for rnd in (1, 2):
                  t0 = time.time()
                  try:
                      r = urllib.request.Request(base + '/chat/completions', method='POST',
                          data=json.dumps({
                              'model': m,
                              'messages': [{'role': 'user', 'content':
                                  'Ответь одним коротким предложением: что такое Docker?'}],
                              'chat_template_kwargs': {'enable_thinking': False},
                              'max_tokens': 200, 'temperature': 0.2}).encode(),
                          headers={'Authorization': 'Bearer ' + key,
                                   'Content-Type': 'application/json'})
                      with urllib.request.urlopen(r, timeout=70) as resp:
                          out = json.loads(resp.read())
                      dt = time.time() - t0
                      msg = (out.get('choices') or [{}])[0].get('message', {})
                      content = (msg.get('content') or '').strip()
                      rc = (msg.get('reasoning_content') or '').strip()
                      print(f'OK r{rnd} {m}: {dt:.1f}s content={len(content)} reasoning={len(rc)}')
                      if content: print('   RU:', content[:120].replace(chr(10), ' '))
                      elif rc: print('   only-reasoning, content пуст')
                  except Exception as e:
                      print(f'FAIL r{rnd} {m}: {time.time()-t0:.1f}s {str(e)[:140]}')
          PY
