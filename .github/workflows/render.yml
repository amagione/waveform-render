name: render

on:
  workflow_dispatch:
    inputs:
      seed:
        description: '32-char hex seed (palette + geometry determinism)'
        required: false
        default: ''
      profile:
        description: 'preview | full'
        required: false
        default: 'preview'

permissions:
  contents: read

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        env:
          CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -euo pipefail
          if [ -z "$SEED" ]; then echo "no seed given - nothing to do"; exit 0; fi
          mkdir -p app
          dl() {
            local url="$1" out="$2" tries="$3" i
            for i in $(seq 1 "$tries"); do
              if curl -fsSL -m 600 --connect-timeout 20 -H "Authorization: Bearer $CI_TOKEN" "$url" -o "$out"; then return 0; fi
              echo "download failed (try $i/$tries): $url"; rm -f "$out"; sleep $((i*4));
            done
            return 1
          }
          dl "$CI_ENDPOINT/bundle" /tmp/bundle.b64 5
          rm -rf /tmp/appx && mkdir -p /tmp/appx
          base64 -d /tmp/bundle.b64 | tar xz -C /tmp/appx
          [ -f /tmp/appx/package.json ] || { echo "kit integrity: package.json missing (truncated?)"; exit 1; }
          rm -f /tmp/bundle.b64
          rm -rf app && mv /tmp/appx app
          echo "kit: ok ($(du -sh app | cut -f1))"
          echo "runtime: $(nproc) cores, $(free -h | awk '/^Mem/{print $2}') mem"

      - name: install
        if: ${{ github.event.inputs.seed != '' }}
        working-directory: app
        run: |
          set -e
          npm ci --no-audit --no-fund > /dev/null 2>&1
          pip install -q -r requirements.txt > /dev/null 2>&1
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1; }
          echo "deps: ok"

      - name: compose
        if: ${{ github.event.inputs.seed != '' }}
        working-directory: app
        env:
          CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsSL -m 30 --connect-timeout 15 -H "Authorization: Bearer $CI_TOKEN" "$CI_ENDPOINT/episode/$SEED" -o /tmp/ep.json; then break; fi
            echo "episode fetch failed (try $i/3)"; rm -f /tmp/ep.json; sleep $((i*4));
          done
          python3 -c "import json,sys; j=json.load(open('/tmp/ep.json')); sys.exit(0 if j.get('ok') else 1)"
          mkdir -p output
          python3 -c "import json; json.dump(json.load(open('/tmp/ep.json')).get('brief') or {}, open('output/brief.json','w'), ensure_ascii=False)"
          BP=$(python3 -c "import json; print(((json.load(open('output/brief.json')).get('image') or {}).get('branch_path') or ''))")
          if [ -n "$BP" ]; then
            mkdir -p "episodes-img/$(dirname "$BP")"
            ok=""
            for i in 1 2 3; do
              if curl -fsSL -m 90 --connect-timeout 15 -H "Authorization: Bearer $CI_TOKEN" "$CI_ENDPOINT/image/$SEED" -o "episodes-img/$BP"; then ok=1; break; fi
              echo "image fetch failed (try $i/3)"; sleep $((i*4));
            done
            [ -n "$ok" ] || { echo "image fetch: giving up"; exit 1; }
            echo "artwork: ok"
          else
            echo "artwork: inline (brief url)"
          fi

      - name: lint
        if: ${{ github.event.inputs.seed != '' }}
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.AUTH_TOKEN }}
          GEMINI_API_KEY_1: ${{ secrets.AUTH_TOKEN_1 }}
          GEMINI_API_KEY_2: ${{ secrets.AUTH_TOKEN_2 }}
          GEMINI_API_KEY_3: ${{ secrets.AUTH_TOKEN_3 }}
          GEMINI_API_KEY_4: ${{ secrets.AUTH_TOKEN_4 }}
          GEMINI_API_KEY_5: ${{ secrets.AUTH_TOKEN_5 }}
          GEMINI_API_KEY_6: ${{ secrets.AUTH_TOKEN_6 }}
          GEMINI_API_KEY_7: ${{ secrets.AUTH_TOKEN_7 }}
          GEMINI_API_KEY_8: ${{ secrets.AUTH_TOKEN_8 }}
          GEMINI_API_KEY_9: ${ secrets.AUTH_TOKEN_9 }
          GEMINI_API_KEY_10: ${ secrets.AUTH_TOKEN_10 }
          GEMINI_API_KEY_11: ${ secrets.AUTH_TOKEN_11 }
          GEMINI_API_KEY_12: ${ secrets.AUTH_TOKEN_12 }
          GEMINI_API_KEY_13: ${ secrets.AUTH_TOKEN_13 }
          GEMINI_API_KEY_14: ${ secrets.AUTH_TOKEN_14 }
          GEMINI_API_KEY_15: ${ secrets.AUTH_TOKEN_15 }
          GEMINI_API_KEY_16: ${ secrets.AUTH_TOKEN_16 }
          YOUTUBE_CLIENT_ID: ${{ secrets.PUB_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.PUB_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.PUB_TOKEN }}
          CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set +e
          python3 scripts/pre_flight_check.py > /tmp/lint.log 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "lint: failed ($RC)"
            curl -fsSL -m 25 -X POST -H "Authorization: Bearer $CI_TOKEN" --data-binary @/tmp/lint.log "$CI_ENDPOINT/prod-log?seed=$SEED&kind=lint" > /dev/null 2>&1 || true
            exit 1
          fi
          echo "lint: ok"

      - name: produce
        if: ${{ github.event.inputs.seed != '' }}
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.AUTH_TOKEN }}
          GEMINI_API_KEY_1: ${{ secrets.AUTH_TOKEN_1 }}
          GEMINI_API_KEY_2: ${{ secrets.AUTH_TOKEN_2 }}
          GEMINI_API_KEY_3: ${{ secrets.AUTH_TOKEN_3 }}
          GEMINI_API_KEY_4: ${{ secrets.AUTH_TOKEN_4 }}
          GEMINI_API_KEY_5: ${{ secrets.AUTH_TOKEN_5 }}
          GEMINI_API_KEY_6: ${{ secrets.AUTH_TOKEN_6 }}
          GEMINI_API_KEY_7: ${{ secrets.AUTH_TOKEN_7 }}
          GEMINI_API_KEY_8: ${{ secrets.AUTH_TOKEN_8 }}
          GEMINI_API_KEY_9: ${ secrets.AUTH_TOKEN_9 }
          GEMINI_API_KEY_10: ${ secrets.AUTH_TOKEN_10 }
          GEMINI_API_KEY_11: ${ secrets.AUTH_TOKEN_11 }
          GEMINI_API_KEY_12: ${ secrets.AUTH_TOKEN_12 }
          GEMINI_API_KEY_13: ${ secrets.AUTH_TOKEN_13 }
          GEMINI_API_KEY_14: ${ secrets.AUTH_TOKEN_14 }
          GEMINI_API_KEY_15: ${ secrets.AUTH_TOKEN_15 }
          GEMINI_API_KEY_16: ${ secrets.AUTH_TOKEN_16 }
          CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set +e
          python3 scripts/produce_from_brief.py --brief output/brief.json --image-root episodes-img > /tmp/produce.log 2>&1
          RC=$?
          set -e
          ship() { curl -fsSL -m 25 -X POST -H "Authorization: Bearer $CI_TOKEN" --data-binary @"$1" "$CI_ENDPOINT/prod-log?seed=$SEED&kind=$2" > /dev/null 2>&1 || true; }
          case $RC in
            0) NM=$(python3 -c "import json;print(json.load(open('output/.narr_meta.json')).get('source','?'))" 2>/dev/null || echo '?'); echo "produce: ok (voice=$NM)"; ship /tmp/produce.log produce ;;
            2|3|4) echo "produce: skipped ($RC)"; touch /tmp/skip_render; ship /tmp/produce.log produce ;;
            *) echo "produce: error ($RC)"; ship /tmp/produce.log produce; exit 1 ;;
          esac

      - name: render
        if: ${{ github.event.inputs.seed != '' }}
        working-directory: app
        env:
          CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -e
          if [ -f /tmp/skip_render ]; then echo "render: skipped"; exit 0; fi
          PROPS_FILE=$(ls -t output/props_*.json | head -1)
          CORES=$(nproc)
          CONC=$(( CORES < 4 ? CORES : 4 ))
          set +e
          npx remotion render src/Root.tsx ShortVideo output/video.mp4 --props=$PROPS_FILE --concurrency=$CONC --codec=h264 --crf=26 --preset=ultrafast --image-format=jpeg --gl=swiftshader --log=warn > /tmp/render.log 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "render: error ($RC)"
            curl -fsSL -m 25 -X POST -H "Authorization: Bearer $CI_TOKEN" --data-binary @/tmp/render.log "$CI_ENDPOINT/prod-log?seed=$SEED&kind=render" > /dev/null 2>&1 || true
            exit 1
          fi
          echo "render: ok (cores=$CORES, conc=$CONC)"

      - name: master
        if: ${{ github.event.inputs.seed != '' }}
        working-directory: app
        run: |
          set -e
          if [ -f /tmp/skip_render ]; then echo "master: skipped"; exit 0; fi
          python3 scripts/normalize_loudness.py output/video.mp4 > /dev/null 2>&1 || true
          set +e
          python3 scripts/guards_from_props.py
          RC=$?
          set -e
          if [ $RC -eq 7 ]; then echo "master: quality gate - publish skipped"; touch /tmp/skip_render; exit 0; fi
          if [ $RC -ne 0 ]; then echo "master: error ($RC)"; exit 1; fi
          echo "master: ok"

      - name: publish
        if: ${{ github.event.inputs.profile == 'full' && github.event.inputs.seed != '' }}
        working-directory: app
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.PUB_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.PUB_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.PUB_TOKEN }}
          CI_ENDPOINT: ${{ secrets.CI_ENDPOINT }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SEED: ${{ github.event.inputs.seed }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          set -e
          if [ -f /tmp/skip_render ]; then echo "publish: skipped"; exit 0; fi
          export PROPS_FILE=$(ls -t output/props_*.json | head -1)
          ship() { curl -fsSL -m 25 -X POST -H "Authorization: Bearer $CI_TOKEN" --data-binary @"$1" "$CI_ENDPOINT/prod-log?seed=$SEED&kind=$2" > /dev/null 2>&1 || true; }
          set +e
          python3 scripts/upload_from_props.py > /tmp/upload.log 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then python3 scripts/tg_notify.py --kind fail --seed "$SEED" --stage publish > /tmp/tg.log 2>&1 || true; echo "publish: error ($RC)"; ship /tmp/upload.log upload; exit 1; fi
          VID=$(grep -o 'video_id=[A-Za-z0-9_-]*' /tmp/upload.log | head -1 | cut -d= -f2)
          curl -fsSL -m 15 -X POST -H "Authorization: Bearer $CI_TOKEN" -H 'content-type: application/json' \
            -d "{\"seed\":\"$SEED\",\"video\":\"$VID\"}" "$CI_ENDPOINT/done" > /dev/null || true
          python3 scripts/tg_notify.py --kind publish --seed "$SEED" --video "$VID" > /tmp/tg.log 2>&1 && echo "notify: ok" || echo "notify: failed"
          python3 scripts/post_pin_comment.py --video "$VID" > /tmp/pin.log 2>&1 && echo "comments: ok" || { echo "comments: failed"; ship /tmp/pin.log pin; }
          python3 scripts/captions_from_props.py --video "$VID" > /tmp/captions.log 2>&1 && echo "captions: ok" || { echo "captions: failed"; ship /tmp/captions.log captions; }
          python3 scripts/playlists_sync.py --video "$VID" > /tmp/playlist.log 2>&1 && echo "playlist: ok" || { echo "playlist: failed"; ship /tmp/playlist.log playlist; }
          echo "publish: ok"

      - name: notify
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          if [ -f app/scripts/tg_notify.py ]; then (cd app && python3 scripts/tg_notify.py --kind fail --seed "$SEED" --stage workflow > /tmp/tg.log 2>&1 && echo "notify: ok") || echo "notify: failed"; else echo "notify: skipped (no kit)"; fi

      - name: cleanup
        if: always()
        run: |
          rm -rf app /tmp/*.log 2>/dev/null || true
          echo "cleanup: done"
